# 板载麦：禁用 PipeWire ALSA 输入（勿 blacklist snd_soc_dmic，会搞死 SOF 扬声器）
# 系统级：所有用户会话生效。来源 arch-config/wireplumber + trial-desktops 准备。
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
