<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prefer these even when an application requests a named system font.
       Inconsolata supplies Latin; Micro Hei supplies missing Chinese glyphs.
       Keep the requested families afterwards for emoji, icons and missing glyphs. -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>Inconsolata</string>
      <string>WenQuanYi Micro Hei</string>
    </edit>
  </match>
</fontconfig>
