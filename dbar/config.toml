[bar]
height = 24
position = "top"
margin = 0
gap = 0
font = "Inconsolata 22"
fallback = ["WenQuanYi Micro Hei", "Symbols Nerd Font", "Liberation Sans"]
icon_size = 17

[bar.background]
color = "#2d353b"

# 两种交替底色，所有模块都是普通矩形。
[style.block]
background = "#343f44"
foreground = "#d3c6aa"
padding = 5
icon_gap = 3

[style.alt]
background = "#3d484d"
foreground = "#d3c6aa"
padding = 5
icon_gap = 3

[left]
groups = ["desktop"]
[center]
groups = ["playing"]
[right]
groups = ["status"]

[group.desktop]
modules = ["workspaces", "title", "mode"]
[group.playing]
modules = ["media"]
[group.status]
modules = ["cpu", "memory", "load", "disk", "temperature", "network", "volume", "brightness", "battery", "language", "tray", "clock"]

[module.workspaces]
source = "workspaces"
style = "block"
foreground = "#859289"
min_width = 28

states.focused = { focused = true, background = "#a7c080", foreground = "#2d353b" }
states.visible = { visible = true, background = "#3d484d", foreground = "#d3c6aa" }
states.urgent = { urgent = true, background = "#e67e80", foreground = "#2d353b" }

[module.title]
source = "window"
style = "block"
max_width = 600

[module.language]
source = "language"
format = "$short"
format_alt = "$layout"
style = "alt"
icon = "$keyboard"
max_width = 160

# niri 没有绑定模式，这项会自动留空。
[module.mode]
source = "mode"
format = "$mode"
style = "block"

[module.media]
source = "media"
controls = true
format = "{$artist  }$title"
format_alt = "$player"
alt_button = "middle"
style = "block"
icon = "$pause"
max_width = 220
states.paused = { field = "status", equals = "paused", foreground = "#859289", icon = "$play" }

[module.cpu]
source = "cpu"
interval = "2s"
format = "$utilization.n(d:0)"
style = "block"
icon = "$cpu"

states.busy = { above = 85, background = "#dbbc7f", foreground = "#2d353b" }

[module.memory]
source = "memory"
interval = "5s"
format = "$percent.n(d:0)"
format_alt = "$used.n(d:1) of $total.n(d:0)"
style = "alt"
icon = "$memory"

states.full = { above = 90, background = "#dbbc7f", foreground = "#2d353b" }

[module.load]
source = "load"
interval = "5s"
format = "L $one.n(d:2)"
format_alt = "$one.n(d:2) $five.n(d:2) $fifteen.n(d:2)"
style = "block"
states.busy = { field = "percent", above = 80, background = "#dbbc7f", foreground = "#2d353b" }

[module.disk]
source = "disk"
path = "/"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = "$available"
style = "alt"
icon = "$disk"
states.full = { above = 90, background = "#dbbc7f", foreground = "#2d353b" }

[module.temperature]
source = "temperature"
interval = "5s"
format = "$temp.n(d:0)"
style = "block"
icon = "$temperature"

states.hot = { state = "critical", background = "#e67e80", foreground = "#2d353b" }

[module.network]
source = "network"
interval = "2s"
format = "$ssid|$device"
format_alt = "$down{  $up}"
style = "alt"
icon = "$wifi"

states.offline = { field = "state", equals = "down", icon = "$wifi-off" }

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
style = "block"
icon = "$volume"

states.headphones_muted = { fields = { muted = "yes", port = "headphones" }, foreground = "#859289", icon = "$headphones-muted" }
states.muted = { field = "muted", equals = "yes", foreground = "#859289", icon = "$volume-muted" }
states.port = { field = "port", equals = "headphones", icon = "$headphones" }

[module.brightness]
source = "backlight"
scroll = "5%"
format = "$brightness.n(d:0)"
style = "alt"
icon = "$brightness"

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = "$percent.n(d:0){  $time.dur(style:short) left}"
style = "block"
icon = "$battery"

states.plugged = { field = "supply", equals = "mains", icon = "$battery-charging" }
states.warning = { state = "warning", background = "#dbbc7f", foreground = "#2d353b" }
states.critical = { state = "critical", background = "#e67e80", foreground = "#2d353b" }

[module.tray]
source = "tray"
style = "alt"
states.attention = { field = "status", equals = "attention", background = "#e67e80" }

[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%a %d %b  %H:%M')"
style = "alt"
foreground = "#2d353b"
background = "#83c092"
icon = "$clock"
