# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
linemode = "mtime"
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

# 内置 image 预览：先缩图缓存再走 Chafa，比每次 chafa CLI 啃原图快
[preview]
max_width = 600
max_height = 900
image_delay = 30
image_filter = "triangle"
image_quality = 70

[opener]
edit = [
	{ run = 'vis %s', block = true, desc = "vis" },
]
