# -*- conf -*-
# Tomorrow Night + 少量实用项（与 arch-config/foot 同步）

font=monospace:size=15
pad=8x8
bold-text-in-bright=palette-based
selection-target=clipboard
initial-color-theme=dark
# niri 1.5：Wayland 下保持默认 dpi-aware=no

[scrollback]
lines=10000
multiplier=3.0

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[url]
style=dotted
osc8-underline=url-mode

[cursor]
style=block
blink=no

[colors-dark]
# Tomorrow Night (Chris Kempson)
background=1d1f21
foreground=c5c8c6
regular0=1d1f21
regular1=cc6666
regular2=b5bd68
regular3=f0c674
regular4=81a2be
regular5=b294bb
regular6=8abeb7
regular7=c5c8c6
bright0=969896
bright1=cc6666
bright2=b5bd68
bright3=f0c674
bright4=81a2be
bright5=b294bb
bright6=8abeb7
bright7=ffffff
selection-foreground=c5c8c6
selection-background=373b41

[key-bindings]
# 默认已有 Ctrl+Shift+c/v；Ctrl+Shift+o 选链接打开
show-urls-launch=Control+Shift+o
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0
search-start=Control+Shift+r
