schema:
  schema_id: moran_fixed_simp
  name: 墨染四码
  version: "1"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  max_code_length: 4
  auto_select: true

translator:
  dictionary: moran_fixed_simp
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default