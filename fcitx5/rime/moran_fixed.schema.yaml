schema:
  schema_id: moran_fixed
  name: 魔然
  version: "20260605"
  author:
    - 自然碼發明人：周志農
    - 方案製作：ksqsf
  description: |
    四碼唯一自動上屏、五碼頂屏的碼表式輸入方式。


engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz=;" # 「置頂」功能：需要加上/
  delimiter: " '"
  max_code_length: 4
  auto_select: true
  auto_clear: max_length # manual | auto | max_length

translator:
  dictionary: moran_fixed_simp
  enable_sentence: false
  enable_completion: false


